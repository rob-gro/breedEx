</head>

<body>

    <div><h1>Edit Breed Name</h1></div>

    <div class="container my-1">
        <button type="button" class="nav-button" onclick="window.location.href='/breeds';">Back to Main Page</button>
    </div>

    <form th:action="@{/breeds/save}" th:object="${breed}" method="post"
          style="max-width: 600px; margin: 0 auto;">

        <!--  below verse is a protection against "add" to DB instead of "edit" -->
        <input type="hidden" th:field="*{id}" th:value="${breed.id}"/>

                <label class="col-form-label col-sm-4 text-warning">Breed Name</label>
                <div class="col-sm-8">
                    <input type="text" th:field="*{breedName}" class="form-control" required>
                </div>
            </div>
            <br>

                <br>

            <div class="form-group row">
                <label class="col-form-label col-sm-4 text-warning">Variety Name</label>
                <div class="col-sm-8">
                    <div th:each="variety, iter : ${breed.varieties}">
                        <input type="text" th:value="${variety.varietyName}" th:field="*{varieties[__${iter.index}__].varietyName}"

                <br>
                <div class="text-center p-3">
                    <button type="submit" class="btn btn-outline-info">Save</button>
                </div>
            </div>

</div>
